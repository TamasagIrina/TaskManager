<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Updated</title>
</head>

<body style="margin:0; padding:0; background-color:#f2f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f8; padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="max-width:560px; width:100%; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.08);">

                <tr>
                    <td style="background-color:#6366F1; padding:28px 32px;">
                        <p style="margin:0; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#e0e7ff; font-weight:700;">
                            Update
                        </p>
                        <h1 style="margin:6px 0 0; font-size:22px; color:#ffffff; font-weight:700;">
                            A project you are part of was updated
                        </h1>
                    </td>
                </tr>

                <tr>
                    <td style="padding:32px;">
                        <p style="margin:0 0 20px; font-size:15px; color:#374151; line-height:1.6;">
                            The following project has been updated. Here are its current details:
                        </p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                            <tr>
                                <td style="padding:10px 0; font-size:13px; color:#6b7280; text-transform:uppercase; letter-spacing:0.04em; width:130px;">Project</td>
                                <td style="padding:10px 0; font-size:15px; color:#111827; font-weight:600;" th:text="${projectName}">Project Name</td>
                            </tr>
                            <tr>
                                <td style="padding:10px 0; font-size:13px; color:#6b7280; text-transform:uppercase; letter-spacing:0.04em; border-top:1px solid #eef0f4; vertical-align:top;">Description</td>
                                <td style="padding:10px 0; font-size:15px; color:#374151; border-top:1px solid #eef0f4;" th:text="${projectDescription} ?: '—'">Description</td>
                            </tr>
                            <tr>
                                <td style="padding:10px 0; font-size:13px; color:#6b7280; text-transform:uppercase; letter-spacing:0.04em; border-top:1px solid #eef0f4;">Status</td>
                                <td style="padding:10px 0; border-top:1px solid #eef0f4;">
                                    <span style="display:inline-block; background-color:#EEF2FF; color:#4338CA; padding:4px 10px; border-radius:6px; font-size:13px; font-weight:600;" th:text="${status}">Status</span>
                                </td>
                            </tr>
                        </table>

                        <p style="margin:28px 0 0; font-size:14px; color:#6b7280; line-height:1.6;">
                            Open the app to see the full project and your tasks.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="background-color:#f9fafb; padding:20px 32px; border-top:1px solid #eef0f4;">
                        <p style="margin:0; font-size:12px; color:#9ca3af;">
                            Task Management — automated notification, please do not reply.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
