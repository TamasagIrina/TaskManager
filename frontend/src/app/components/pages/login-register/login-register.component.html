<div class="auth-container">

  <div class="toggle-buttons">
    <button (click)="switchToLogin()" [class.active]="logOrReg">Login</button>
    <button (click)="switchToRegister()" [class.active]="!logOrReg">Register</button>
  </div>

  @if (logOrReg) {
  <div class="form-wrapper">
    <h2>Login</h2>

    <div class="input-group">
      <label for="login-username">Email</label>
      <input type="email" id="login-username" #loginUsername placeholder="Enter email" (input)="clearError()">
    </div>

    <div class="input-group">
      <label for="loginPassword">Password</label>
      <div class="password-field">

        <input [type]="showPassword() ? 'text' : 'password'" id="loginPassword" #loginPassword
          placeholder="Choose a password" (input)="clearError()">
        <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
          <span class="material-icons">
            {{ showPassword() ? 'visibility_off' : 'visibility' }}
          </span>
        </button>
      </div>

    </div>

    <button class="action-btn" [disabled]="isLoading()" (click)="login(loginUsername.value, loginPassword.value)">
      {{ isLoading() ? 'Signing in...' : 'Sign In' }}
    </button>
  </div>
  }
  @else {
  <div class="form-wrapper">
    <h2>Create Account</h2>

    <div class="input-group">
      <label for="reg-username">Username</label>
      <input type="text" id="reg-username" #regUsername placeholder="Choose a username" (input)="clearError()">
    </div>

    <div class="input-group">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" #regEmail placeholder="address@email.com" (input)="clearError()">
    </div>

    <div class="input-group">
      <label for="reg-password">Password</label>
      <div class="password-field">

        <input [type]="showPassword() ? 'text' : 'password'" id="reg-password" #regPassword
          placeholder="Choose a password" (input)="clearError()">
        <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
          <span class="material-icons">
            {{ showPassword() ? 'visibility_off' : 'visibility' }}
          </span>
        </button>
      </div>

    </div>

    <div class="input-group">
      <label for="reg-birthdate">Date of Birth</label>
      <input type="date" id="reg-birthdate" #regBirthDate (input)="clearError()">
    </div>

    <button class="action-btn" [disabled]="isLoading()"
      (click)="register(regUsername.value, regEmail.value, regPassword.value, regBirthDate.value)">
      {{ isLoading() ? 'Creating account...' : 'Sign Up' }}
    </button>
  </div>
  }
  @if (errorMessage()) {
  <div class="error-message">
    <p>{{ errorMessage() }}</p>
  </div>
  }

</div>
